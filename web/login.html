<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCafe Signals Login</title>
  <style>
    :root { --bg:#0b0e14; --card:#151922; --border:#232936; --text:#e1e4ea; --muted:#8b92a2; --blue:#3b82f6; --red:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; display:grid; place-items:center; padding:16px; }
    form { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:28px; width:100%; max-width:360px; display:grid; gap:14px; }
    h1 { font-size:20px; letter-spacing:.5px; } h1 span { color:var(--blue); }
    p { color:var(--muted); font-size:13px; line-height:1.5; }
    label { display:grid; gap:6px; font-size:13px; color:var(--muted); }
    input { padding:10px 12px; border-radius:6px; border:1px solid var(--border); background:#10141d; color:var(--text); font-size:15px; }
    input:focus { outline:2px solid var(--blue); outline-offset:1px; }
    button { padding:11px; border:none; border-radius:6px; background:var(--blue); color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    #err { color:var(--red); font-size:13px; min-height:18px; }
  </style>
</head>
<body>
  <form id="f">
    <h1>CODECAFE SIGNALS <span>LOGIN</span></h1>
    <p>AI trade ideas and paper trading at real market prices.</p>
    <label>Username <input id="u" autocomplete="username" required autofocus></label>
    <label>Password <input id="p" type="password" autocomplete="current-password" required></label>
    <button id="b">Log in</button>
    <div id="err" role="alert"></div>
    <p>Educational ideas, not financial advice. Paper trading uses fake money.</p>
  </form>
  <script>
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const b = document.getElementById("b"), err = document.getElementById("err");
      b.disabled = true; err.textContent = "";
      try {
        const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({username: document.getElementById("u").value, password: document.getElementById("p").value})});
        const j = await r.json();
        if (r.ok) location.href = "/"; else err.textContent = j.error || "Login failed.";
      } catch (x) { err.textContent = "Can't reach the server."; }
      b.disabled = false;
    };
  </script>
</body>
</html>
