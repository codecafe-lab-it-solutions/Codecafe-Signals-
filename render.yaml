# Render Blueprint: Render -> New -> Blueprint -> pick this repo. It builds the Dockerfile and
# redeploys on every push to main. Secrets marked sync:false are typed in once on Render's setup screen.
services:
  - type: web
    name: codecafe-signals
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_USER
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
